# Paste into Streamlit Cloud -> Advanced settings -> Secrets.
# Replace placeholders there, never commit the real values.
GOOGLE_PLACES_API_KEY = "YOUR_GOOGLE_KEY"
QUOTA_BACKEND = "postgres"
QUOTA_DATABASE_URL = "postgresql://postgres.PROJECT_REF:ENCODED_PASSWORD@POOLER_HOST:5432/postgres"
MONTHLY_REQUEST_LIMIT = 950

[EXTERNAL_USAGE_BY_MONTH]
# Set to the month's total uncounted usage BEFORE switching to cloud.
# Include local requests if local and cloud do not share the database.
"2026-10" = 0
